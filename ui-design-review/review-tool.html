<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Design Review Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #0c0e14;
    --bg-primary: #111420;
    --bg-card: #181c28;
    --bg-card-hover: #1e2336;
    --accent: #c9a96e;
    --accent-dim: rgba(201,169,110,0.15);
    --text-primary: #e8e4df;
    --text-secondary: #8b8d97;
    --text-muted: #5c5e6a;
    --border: rgba(201,169,110,0.1);
    --border-subtle: rgba(255,255,255,0.04);
    --green: #6ecf8e;
    --red: #e06c6c;
    --blue: #6ba3d6;
    --amber: #e8a86d;
    --font-body: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif;
    --font-mono: 'SF Mono', Menlo, Monaco, Consolas, monospace;
    --radius: 12px;
    --radius-sm: 8px;
    --sidebar-width: 320px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg-deep);
    color: var(--text-primary);
  }

  /* Layout */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header */
  .header {
    height: 56px;
    background: var(--bg-primary);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .header h1 span {
    color: var(--accent);
  }

  .header-actions {
    display: flex;
    gap: 10px;
  }

  .btn {
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg-deep);
  }

  .btn-primary:hover {
    background: #d4b57a;
  }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
  }

  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--text-primary);
  }

  /* Content Area */
  .content {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* Preview Panel */
  .preview-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-card);
    min-width: 0;
    min-height: 0;
  }

  .preview-header {
    height: 44px;
    padding: 0 16px;
    background: rgba(17,20,32,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 10;
  }

  .preview-url {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .preview-url .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
  }

  .mode-indicator {
    font-size: 12px;
    color: var(--accent);
  }

  .mode-indicator.drawing {
    color: var(--amber);
  }

  .preview-container {
    flex: 1;
    position: relative;
    overflow: auto;
    min-height: 0;
  }

  .preview-iframe {
    width: 100%;
    height: 100%;
    min-height: 100%;
    border: none;
    display: block;
  }

  /* Overlay for drawing rectangles - synced with iframe scroll */
  .draw-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    cursor: crosshair;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }

  .draw-overlay.active {
    pointer-events: auto;
  }

  .draw-overlay.view-mode {
    cursor: default;
  }

  .comment-box {
    position: absolute;
    border: 2px solid var(--accent);
    background: rgba(201, 169, 110, 0.1);
    border-radius: 4px;
    cursor: move;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    transition: background 0.15s;
  }

  .comment-box:hover {
    background: rgba(201, 169, 110, 0.2);
  }

  .comment-box.resolved {
    border-color: var(--green);
    background: rgba(110, 207, 142, 0.1);
  }

  .comment-box.resolved .box-number {
    color: var(--green);
  }

  .box-number {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--bg-primary);
    border-left: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
    transition: width 0.3s ease;
  }

  .sidebar.collapsed {
    width: 44px;
  }

  .sidebar-header {
    height: 44px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    flex-shrink: 0;
  }

  .sidebar-header:hover {
    background: var(--bg-card-hover);
  }

  .sidebar-header h2 {
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .sidebar.collapsed .sidebar-header h2 span.label {
    display: none;
  }

  .sidebar.collapsed .sidebar-header h2 span.icon {
    margin: 0;
  }

  .collapse-icon {
    font-size: 12px;
    transition: transform 0.2s;
  }

  .sidebar.collapsed .collapse-icon {
    transform: rotate(180deg);
  }

  .sidebar-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity 0.3s;
  }

  .sidebar.collapsed .sidebar-content {
    display: none;
  }

  /* Comments Stats */
  .comments-stats {
    height: 40px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .stat .count {
    font-family: var(--font-mono);
    font-weight: 600;
  }

  .stat.pending .count { color: var(--amber); }
  .stat.resolved .count { color: var(--green); }

  /* Comments List */
  .comments-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  .comment-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .comment-card.active {
    border-color: var(--accent);
  }

  .comment-card.resolved {
    opacity: 0.7;
  }

  .comment-card-header {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .comment-card-header:hover {
    background: var(--bg-card-hover);
  }

  .comment-number {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    flex-shrink: 0;
  }

  .comment-card.resolved .comment-number {
    background: rgba(110, 207, 142, 0.2);
    color: var(--green);
  }

  .comment-title {
    flex: 1;
    margin-left: 10px;
    font-size: 13px;
    color: var(--text-primary);
  }

  .comment-status {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    background: rgba(232, 168, 109, 0.15);
    color: var(--amber);
  }

  .comment-card.resolved .comment-status {
    background: rgba(110, 207, 142, 0.15);
    color: var(--green);
  }

  .comment-body {
    padding: 0 14px 14px;
  }

  .comment-textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 10px;
    font-size: 13px;
    font-family: var(--font-body);
    color: var(--text-primary);
    resize: vertical;
    min-height: 80px;
  }

  .comment-textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .comment-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .comment-actions .btn {
    flex: 1;
    padding: 8px;
    font-size: 12px;
  }

  .btn-resolve {
    background: rgba(110, 207, 142, 0.15);
    color: var(--green);
  }

  .btn-resolve:hover {
    background: rgba(110, 207, 142, 0.25);
  }

  .btn-delete {
    background: rgba(224, 108, 108, 0.15);
    color: var(--red);
  }

  .btn-delete:hover {
    background: rgba(224, 108, 108, 0.25);
  }

  /* Prompt Panel - at bottom */
  .prompt-panel {
    height: 180px;
    background: var(--bg-primary);
    border-top: 1px solid var(--border-subtle);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }

  .prompt-panel .prompt-toggle {
    height: 40px;
    padding: 0 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .prompt-panel .prompt-toggle:hover {
    background: var(--bg-card-hover);
  }

  .prompt-panel .prompt-toggle h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .prompt-panel .prompt-content {
    flex: 1;
    padding: 0 14px 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .prompt-panel .prompt-content.collapsed {
    display: none;
  }

  .prompt-panel .prompt-output {
    flex: 1;
    overflow-y: auto;
  }

  .prompt-output {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 12px;
    font-size: 12px;
    line-height: 1.5;
    max-height: 150px;
    overflow-y: auto;
    white-space: pre-wrap;
    color: var(--text-primary);
  }

  .prompt-output:empty::before {
    content: 'Add comments to generate a review prompt...';
    color: var(--text-muted);
  }

  .prompt-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
    gap: 8px;
  }

  .copy-feedback {
    color: var(--green);
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
  }

  .copy-feedback.show {
    opacity: 1;
  }

  /* Empty State */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: var(--text-muted);
    text-align: center;
    padding: 20px;
  }

  .empty-state .icon {
    font-size: 36px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  .empty-state p {
    font-size: 12px;
    line-height: 1.5;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <h1>UI Design <span>Review</span></h1>
    <div class="header-actions">
      <button class="btn btn-secondary" id="toggleMode">✏️ Draw Mode</button>
      <button class="btn btn-secondary" id="clearAll">🗑️ Clear</button>
    </div>
  </header>

  <!-- Content -->
  <div class="content">
    <!-- Preview Panel -->
    <div class="preview-panel">
      <div class="preview-header">
        <div class="preview-url">
          <span class="dot"></span>
          <span id="targetUrl">pages/mortgage-overview-standalone.html</span>
        </div>
        <div class="mode-indicator" id="modeIndicator">👁️ View Mode</div>
      </div>
      <div class="preview-container">
        <iframe id="previewIframe" class="preview-iframe" src=""></iframe>
        <div class="draw-overlay view-mode" id="drawOverlay"></div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header" id="sidebarToggle">
        <h2>💬 <span class="label">Comments</span></h2>
        <span class="collapse-icon">◀</span>
      </div>
      <div class="sidebar-content">
        <div class="comments-stats">
          <div class="stat pending">
            <span class="count" id="pendingCount">0</span>
            <span>Pending</span>
          </div>
          <div class="stat resolved">
            <span class="count" id="resolvedCount">0</span>
            <span>Resolved</span>
          </div>
        </div>
        <div class="comments-list" id="commentsList">
          <div class="empty-state" id="emptyState">
            <div class="icon">💬</div>
            <p>Click "Draw Mode" and draw rectangles on the preview</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Prompt Panel - below content -->
  <div class="prompt-panel" id="promptPanel">
    <div class="prompt-toggle" id="promptToggle">
      <h3>📋 <span class="label">Prompt</span></h3>
      <span class="collapse-icon" id="promptCollapseIcon">▼</span>
    </div>
    <div class="prompt-content" id="promptContent">
      <div class="prompt-output" id="promptOutput"></div>
      <div class="prompt-actions">
        <span class="copy-feedback" id="copyFeedback">✓ Copied!</span>
        <button class="btn btn-primary" id="copyPrompt">📋 Copy</button>
      </div>
    </div>
  </div>
</div>

<script>
const TARGET_PAGE = 'pages/mortgage-overview-standalone.html';

// State
let state = {
  mode: 'view',
  comments: [],
  activeCommentId: null,
  isDrawing: false,
  drawStart: null,
  sidebarCollapsed: false,
  promptCollapsed: false
};

// DOM Elements
const iframe = document.getElementById('previewIframe');
const overlay = document.getElementById('drawOverlay');
const previewContainer = document.querySelector('.preview-container');
const commentsList = document.getElementById('commentsList');
const emptyState = document.getElementById('emptyState');
const pendingCount = document.getElementById('pendingCount');
const resolvedCount = document.getElementById('resolvedCount');
const promptOutput = document.getElementById('promptOutput');
const copyFeedback = document.getElementById('copyFeedback');
const toggleModeBtn = document.getElementById('toggleMode');
const clearAllBtn = document.getElementById('clearAll');
const copyPromptBtn = document.getElementById('copyPrompt');
const modeIndicator = document.getElementById('modeIndicator');
const sidebar = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebarToggle');
const promptToggle = document.getElementById('promptToggle');
const promptContent = document.getElementById('promptContent');
const promptCollapseIcon = document.getElementById('promptCollapseIcon');

// Initialize
function init() {
  iframe.src = TARGET_PAGE;

  // Sync scroll between container and overlay
  previewContainer.addEventListener('scroll', () => {
    overlay.scrollTop = previewContainer.scrollTop;
    overlay.scrollLeft = previewContainer.scrollLeft;
  });

  overlay.addEventListener('mousedown', onMouseDown);
  overlay.addEventListener('mousemove', onMouseMove);
  overlay.addEventListener('mouseup', onMouseUp);
  overlay.addEventListener('mouseleave', onMouseUp);

  toggleModeBtn.addEventListener('click', toggleMode);
  clearAllBtn.addEventListener('click', clearAll);
  copyPromptBtn.addEventListener('click', copyPrompt);
  sidebarToggle.addEventListener('click', toggleSidebar);
  promptToggle.addEventListener('click', togglePrompt);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.mode === 'draw') {
      toggleMode();
    }
    if (e.key === 'd' && !e.metaKey && !e.ctrlKey && e.target.tagName !== 'TEXTAREA') {
      toggleMode();
    }
    if (e.key === '[' && !e.metaKey && !e.ctrlKey && e.target.tagName !== 'TEXTAREA') {
      toggleSidebar();
    }
  });
}

function toggleMode() {
  state.mode = state.mode === 'view' ? 'draw' : 'view';
  overlay.classList.toggle('view-mode', state.mode === 'view');
  overlay.classList.toggle('active', state.mode === 'draw');
  toggleModeBtn.textContent = state.mode === 'draw' ? '👁️ Exit Draw' : '✏️ Draw Mode';
  toggleModeBtn.classList.toggle('btn-primary', state.mode === 'draw');
  toggleModeBtn.classList.toggle('btn-secondary', state.mode === 'view');
  modeIndicator.textContent = state.mode === 'draw' ? '✏️ Draw Mode' : '👁️ View Mode';
  modeIndicator.classList.toggle('drawing', state.mode === 'draw');
}

function toggleSidebar() {
  state.sidebarCollapsed = !state.sidebarCollapsed;
  sidebar.classList.toggle('collapsed', state.sidebarCollapsed);
}

function togglePrompt() {
  state.promptCollapsed = !state.promptCollapsed;
  promptContent.classList.toggle('collapsed', state.promptCollapsed);
  promptCollapseIcon.textContent = state.promptCollapsed ? '▲' : '▼';
}

function clearAll() {
  if (state.comments.length === 0) return;
  if (!confirm('Clear all comments?')) return;
  state.comments = [];
  renderComments();
  renderOverlay();
  updatePrompt();
}

function onMouseDown(e) {
  if (state.mode !== 'draw') return;
  const rect = overlay.getBoundingClientRect();
  state.isDrawing = true;
  state.drawStart = {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

function onMouseMove(e) {
  if (!state.isDrawing) return;
  const rect = overlay.getBoundingClientRect();
  const currentX = e.clientX - rect.left;
  const currentY = e.clientY - rect.top;

  const tempRect = overlay.querySelector('.temp-rect');
  if (tempRect) tempRect.remove();

  const temp = document.createElement('div');
  temp.className = 'comment-box temp-rect';
  temp.style.left = Math.min(state.drawStart.x, currentX) + 'px';
  temp.style.top = Math.min(state.drawStart.y, currentY) + 'px';
  temp.style.width = Math.abs(currentX - state.drawStart.x) + 'px';
  temp.style.height = Math.abs(currentY - state.drawStart.y) + 'px';
  overlay.appendChild(temp);
}

function onMouseUp(e) {
  if (!state.isDrawing) return;
  state.isDrawing = false;

  const rect = overlay.getBoundingClientRect();
  const currentX = e.clientX - rect.left;
  const currentY = e.clientY - rect.top;

  const tempRect = overlay.querySelector('.temp-rect');
  if (tempRect) tempRect.remove();

  const width = Math.abs(currentX - state.drawStart.x);
  const height = Math.abs(currentY - state.drawStart.y);

  if (width < 30 || height < 20) return;

  const comment = {
    id: Date.now(),
    number: state.comments.length + 1,
    x: Math.min(state.drawStart.x, currentX),
    y: Math.min(state.drawStart.y, currentY),
    width: width,
    height: height,
    text: '',
    resolved: false
  };

  state.comments.push(comment);
  state.activeCommentId = comment.id;
  renderComments();
  renderOverlay();
  updatePrompt();
}

function renderOverlay() {
  overlay.querySelectorAll('.comment-box:not(.temp-rect)').forEach(el => el.remove());

  state.comments.forEach(comment => {
    const box = document.createElement('div');
    box.className = 'comment-box' + (comment.resolved ? ' resolved' : '');
    box.style.left = comment.x + 'px';
    box.style.top = comment.y + 'px';
    box.style.width = comment.width + 'px';
    box.style.height = comment.height + 'px';
    box.innerHTML = `<span class="box-number">${comment.number}</span>`;
    box.dataset.id = comment.id;

    box.addEventListener('click', (e) => {
      e.stopPropagation();
      state.activeCommentId = comment.id;
      renderComments();
    });

    overlay.appendChild(box);
  });
}

function renderComments() {
  if (state.comments.length === 0) {
    emptyState.style.display = 'flex';
    commentsList.querySelectorAll('.comment-card').forEach(el => el.remove());
  } else {
    emptyState.style.display = 'none';

    commentsList.innerHTML = '';
    state.comments.forEach(comment => {
      const card = document.createElement('div');
      card.className = 'comment-card' +
        (comment.id === state.activeCommentId ? ' active' : '') +
        (comment.resolved ? ' resolved' : '');
      card.innerHTML = `
        <div class="comment-card-header" data-id="${comment.id}">
          <div class="comment-number">${comment.number}</div>
          <div class="comment-title">Comment ${comment.number}</div>
          <div class="comment-status">${comment.resolved ? 'Resolved' : 'Pending'}</div>
        </div>
        <div class="comment-body">
          <textarea class="comment-textarea"
            placeholder="Describe changes needed..."
            data-id="${comment.id}">${comment.text}</textarea>
          <div class="comment-actions">
            <button class="btn btn-resolve" data-action="resolve" data-id="${comment.id}">
              ${comment.resolved ? '↩️ Unresolve' : '✓ Resolve'}
            </button>
            <button class="btn btn-delete" data-action="delete" data-id="${comment.id}">🗑️</button>
          </div>
        </div>
      `;

      card.querySelector('.comment-card-header').addEventListener('click', () => {
        state.activeCommentId = comment.id;
        renderComments();
      });

      card.querySelector('.comment-textarea').addEventListener('input', (e) => {
        const c = state.comments.find(c => c.id === comment.id);
        if (c) c.text = e.target.value;
        updatePrompt();
      });

      card.querySelector('[data-action="resolve"]').addEventListener('click', () => {
        const c = state.comments.find(c => c.id === comment.id);
        if (c) c.resolved = !c.resolved;
        renderComments();
        renderOverlay();
        updatePrompt();
      });

      card.querySelector('[data-action="delete"]').addEventListener('click', () => {
        deleteComment(comment.id);
      });

      commentsList.appendChild(card);
    });
  }

  const pending = state.comments.filter(c => !c.resolved).length;
  const resolved = state.comments.filter(c => c.resolved).length;
  pendingCount.textContent = pending;
  resolvedCount.textContent = resolved;
}

function deleteComment(id) {
  const idx = state.comments.findIndex(c => c.id === id);
  if (idx === -1) return;
  state.comments.splice(idx, 1);
  state.comments.forEach((c, i) => c.number = i + 1);
  if (state.activeCommentId === id) {
    state.activeCommentId = null;
  }
  renderComments();
  renderOverlay();
  updatePrompt();
}

function updatePrompt() {
  const pending = state.comments.filter(c => !c.resolved && c.text.trim());
  const resolved = state.comments.filter(c => c.resolved && c.text.trim());

  if (pending.length === 0 && resolved.length === 0) {
    promptOutput.textContent = '';
    return;
  }

  let prompt = 'Update UI at ' + TARGET_PAGE + ':\n\n';

  if (pending.length > 0) {
    prompt += '## Pending\n\n';
    pending.forEach(c => {
      prompt += `${c.number}. [Area (${Math.round(c.x)}, ${Math.round(c.y)}, ${Math.round(c.width)}×${Math.round(c.height)})]: ${c.text}\n\n`;
    });
  }

  if (resolved.length > 0) {
    prompt += '\n## Resolved\n\n';
    resolved.forEach(c => {
      prompt += `${c.number}. [Area]: ${c.text}\n`;
    });
  }

  promptOutput.textContent = prompt;
}

function copyPrompt() {
  const text = promptOutput.textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    copyFeedback.classList.add('show');
    setTimeout(() => copyFeedback.classList.remove('show'), 2000);
  });
}

// Start
init();
</script>
</body>
</html>
