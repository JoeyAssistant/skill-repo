# agent_factory/schema/examples/feature.yaml
id: 1
title: 001-income-module
user_input: |
  用户原话："我想记收入，现在只有支出模块，月底看不到净收支。"

summary: 支持收入录入与按月汇总，解决月底看不到净收支的问题

background:
  pain_point: |
    现有 expense 模块只记支出，无法看到完整财务画像。
    月底复盘时收入数据散落在多个银行/支付宝/工资单里。
  benefit: |
    集中记录收入流水，与支出模块联合分析月度净收支。

spec:
  income:
    functions:
      - 录入收入（单条/批量，支持 JSON 输入）
      - 按月查询收入

e2e_test_cases:
  - name: 录入并查询
    precondition: data/income.json 为空数组
    inputs:
      amount: 5000
      date: 2026-08-08
    steps:
      - "python3 cli/income.py add --type salary --amount 5000 --date 2026-08-08"
      - "python3 cli/income.py list --month 2026-08"
    observations:
      - check: "list 输出"
        expect: "含 amount=5000、type=salary 的条目"
    cleanup:
      - "python3 cli/income.py delete --month 2026-08 --type salary（或恢复 data/income.json 为执行前的空数组）"
      - "rm -f /tmp/qa-income-*.json"

deploy:
  - "prod 的 config/income.yaml 新增 income.categories 配置项，写入后重启服务，确认 /api/income/categories 返回新分类"
  - "迁移 data/income.json 旧格式（amount 为字符串）到新格式（amount 为数字），迁移后核对条目数一致"

subagent_runs:
  - id: 1
    agent: developer
    task: 首次实现
    dispatched_at: "2026-11-13T06:00:00Z"
    result: complete
    duration_s: 900
  - id: 2
    agent: qa
    task: 首次验收
    dispatched_at: "2026-11-13T06:16:00Z"
    result: fail
    duration_s: 420
  - id: 3
    agent: developer
    task: 修复 QA 问题
    dispatched_at: "2026-11-13T06:24:00Z"
    result: null
    duration_s: null
