# agent_factory/schema/examples/feature.yaml
id: 1
title: 001-income-module
desc: |
  用户原话："我想记收入，现在只有支出模块，月底看不到净收支。"
agent_type: cli-only

background:
  pain_point: |
    现有 expense 模块只记支出，无法看到完整财务画像。
    月底复盘时收入数据散落在多个银行/支付宝/工资单里。
  benefit: |
    集中记录收入流水，与支出模块联合分析月度净收支。

spec:
  income:
    functions:
      - 录入收入（单条/批量，支持 JSON 输入）
      - 按月查询收入
    schema: |
      class IncomeType(str, Enum):
          SALARY = "salary"
          BONUS = "bonus"
          OTHER = "other"

      @dataclass
      class IncomeEntry:
          id: int
          type: IncomeType
          amount: float    # 约束：> 0
          date: date
          note: str = ""
    interface: |
      | 命令 | 用途 | 关键参数 |
      |------|------|----------|
      | add | 录入单条收入 | --type, --amount, --date |
      | list | 按月查询收入 | --month |

test_cases:
  - name: 录入并查询
    precondition: data/income.json 为空数组
    steps: |
      python3 cli/income.py add --type salary --amount 5000 --date 2026-08-08
      python3 cli/income.py list --month 2026-08
    expected: list 输出含 amount=5000、type=salary 的条目
