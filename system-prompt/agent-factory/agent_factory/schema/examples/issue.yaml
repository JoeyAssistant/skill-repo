# agent_factory/schema/examples/issue.yaml
id: 1
title: 001-login-crash

scenario: |
  现象：登录页面点击提交后页面崩溃，控制台报错 "Cannot read property 'token' of undefined"。

  复现步骤：
  1. 打开 /login
  2. 输入 admin / 123456
  3. 点击"登录"
  4. 观察控制台

  环境：生产环境，Chrome 120，commit abc1234。

impact: |
  问题点：login.py L42 取 token 时未做空值判断。
  后端密码错误时返回的 JSON 没有 token 字段，前端代码假设 token 一定存在。

  影响范围：所有用户无法登录，P1。

root_cause: |
  login.py L42 未做空值判断；后端密码错误时返回的 JSON 没有 token 字段，
  前端代码假设 token 一定存在。

fix_plan: |
  ## 怎么修改
  在 cli/login.py 的 handle_login 函数里，对 response.token 加 None 校验：
  ```python
  if not response.get("token"):
      return error("账号或密码错误")
  ```

  ## 修改哪里
  - 文件：cli/login.py
  - 函数：handle_login (L40-L60)
  - 新增：L42 后插入 3 行校验
  - 测试：test_login_failure.py 加 test_login_wrong_password_returns_error

action: direct-fix

fix: |
  Changed Files:
    - cli/login.py (+5)
    - src/auth/service.py (+3)
  Regression Test: test_login_failure.py 新增 test_login_wrong_password_returns_error

resolution: direct-fix
