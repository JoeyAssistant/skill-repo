id: 1
title: 001-login-crash
desc: |
  用户反馈：登录页面点击提交就崩溃了，控制台报错 token undefined。

  用户原话："今天早上想登录查账户，结果一点提交就白屏，刷新也没用。"

scenario: |
  现象：登录页面点击提交后页面崩溃。
  复现步骤：
  1. 打开 /login
  2. 输入 admin / 123456
  3. 点击"登录"
  环境：生产，Chrome 120，commit abc1234。

impact: |
  问题点：login.py L42 取 token 时未做空值判断。
  影响范围：所有用户无法登录，P1。

root_cause: |
  login.py L42 未做空值判断；后端密码错误时返回的 JSON 没有 token 字段。

fix_plan: |
  ## 问题分析
  前端假设 token 一定存在，后端在错误响应里省略了 token。

  ## 修复方向
  - 文件：cli/login.py
  - 函数：handle_login (L40-L60)
  - 改动：加 token 存在性校验
  - 回归测试：test_login_wrong_password_returns_error

  ## qa-diagnosis 建议
  建议转 feature，按 feature 流程设计并验收。

result:
  type: converted_to_feature
  feature_id: 1
