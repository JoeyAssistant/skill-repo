<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Review — <!-- FILL: doc filename --> (round <!-- FILL: round number -->)</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128;
    --border: #30363d; --text: #c9d1d9; --text2: #8b949e;
    --amber: #bf8700; --green: #1a7f37; --red: #cf222e; --blue: #58a6ff; --cyan: #39d2c0;
    --amber-bg: rgba(191,135,0,0.08); --green-bg: rgba(26,127,55,0.08); --red-bg: rgba(207,34,46,0.08);
    --blue-bg: rgba(88,166,255,0.08); --cyan-bg: rgba(57,210,192,0.06);
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .header h1 { font-size: 15px; font-weight: 600; }
  .header .file { color: var(--text2); font-size: 13px; font-family: "SF Mono", Monaco, monospace; }
  .header .hint { color: var(--text2); font-size: 12px; margin-left: 8px; }
  .header .hint kbd { background: var(--bg3); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; font-family: "SF Mono", Monaco, monospace; font-size: 11px; }
  .stats { margin-left: auto; display: flex; gap: 14px; font-size: 12px; }
  .stat { display: flex; align-items: center; gap: 4px; }
  .stat .dot { width: 8px; height: 8px; border-radius: 50%; }
  .stat .dot.pending { background: var(--amber); }
  .stat .dot.approved { background: var(--green); }
  .stat .dot.rejected { background: var(--red); }
  .stat .dot.user-comment { background: var(--blue); }
  .stat .count { color: var(--text2); }
  .main { flex: 1; display: flex; overflow: hidden; }
  .doc-panel { flex: 1; overflow-y: auto; border-right: 1px solid var(--border); }
  .doc-panel::-webkit-scrollbar { width: 6px; }
  .doc-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .doc-line { display: flex; padding: 0 16px 0 0; min-height: 22px; line-height: 22px; font-size: 13px; font-family: "SF Mono", Monaco, Consolas, monospace; border-left: 3px solid transparent; transition: background 0.15s, border-color 0.15s; cursor: pointer; }
  .doc-line:hover { background: var(--bg3); }
  .doc-line.approved { border-left-color: var(--green); background: var(--green-bg); }
  .doc-line.rejected { border-left-color: var(--red); background: var(--red-bg); opacity: 0.55; }
  .doc-line.pending { border-left-color: var(--amber); background: var(--amber-bg); }
  .doc-line.user-commented { border-left-color: var(--blue); background: var(--blue-bg); }
  .doc-line .line-num { width: 50px; text-align: right; padding-right: 16px; color: var(--text2); user-select: none; flex-shrink: 0; font-size: 12px; }
  .doc-line .line-content { flex: 1; white-space: pre; }
  .doc-line .add-comment-btn { opacity: 0; margin-left: 8px; background: none; border: 1px solid var(--border); color: var(--text2); cursor: pointer; font-size: 14px; width: 22px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: opacity 0.15s, border-color 0.15s, color 0.15s; flex-shrink: 0; }
  .doc-line:hover .add-comment-btn { opacity: 1; }
  .doc-line .add-comment-btn:hover { border-color: var(--blue); color: var(--blue); }
  .doc-line.code-start, .doc-line.code-end { background: var(--bg2) !important; border-left-color: transparent !important; opacity: 1 !important; cursor: default; }
  .doc-line.code-content { background: var(--bg2) !important; border-left-color: transparent !important; opacity: 1 !important; cursor: default; }
  .doc-line h1-line { font-size: 20px; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; color: #fff; line-height: 28px; }
  .doc-line h2-line { font-size: 16px; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; color: #fff; line-height: 26px; }
  .doc-line h3-line { font-size: 14px; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; color: #fff; }
  .doc-line .line-content code { background: var(--bg3); padding: 1px 5px; border-radius: 3px; font-size: 12px; color: var(--blue); }
  .doc-line .line-content strong { color: #fff; font-weight: 600; }
  .inline-comment { display: flex; align-items: flex-start; gap: 8px; padding: 6px 16px 6px 69px; background: var(--blue-bg); border-left: 3px solid var(--blue); animation: slideIn 0.15s ease; }
  .inline-comment textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font-size: 12px; color: var(--text); resize: vertical; min-height: 32px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; }
  .inline-comment textarea:focus { outline: none; border-color: var(--blue); }
  .inline-comment textarea::placeholder { color: var(--text2); }
  .inline-comment .inline-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .inline-comment .inline-actions button { padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); transition: all 0.15s; }
  .inline-comment .inline-actions button.save-btn:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .inline-comment .inline-actions button.cancel-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }
  .inline-comment-display { display: flex; align-items: flex-start; gap: 8px; padding: 4px 16px 4px 69px; background: var(--cyan-bg); border-left: 3px solid var(--cyan); }
  .inline-comment-display .comment-icon { color: var(--cyan); font-size: 12px; flex-shrink: 0; margin-top: 2px; }
  .inline-comment-display .comment-body { flex: 1; }
  .inline-comment-display .comment-text { font-size: 12px; color: var(--text); line-height: 1.5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; }
  .inline-comment-display .comment-actions { margin-top: 4px; }
  .inline-comment-display .comment-actions button { padding: 1px 6px; border-radius: 3px; font-size: 11px; cursor: pointer; border: none; background: transparent; color: var(--text2); transition: color 0.15s; }
  .inline-comment-display .comment-actions button:hover { color: var(--text); }
  .inline-comment-display .comment-actions button.del-btn:hover { color: var(--red); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .suggestions-panel { width: 400px; display: flex; flex-direction: column; flex-shrink: 0; background: var(--bg2); }
  .filter-tabs { display: flex; padding: 10px 16px; gap: 6px; border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
  .filter-tab { padding: 4px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); transition: all 0.15s; }
  .filter-tab:hover { border-color: var(--text2); color: var(--text); }
  .filter-tab.active { background: var(--bg3); border-color: var(--blue); color: var(--blue); }
  .suggestion-list { flex: 1; overflow-y: auto; padding: 8px; }
  .suggestion-list::-webkit-scrollbar { width: 6px; }
  .suggestion-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .suggestion-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
  .suggestion-card:hover { border-color: var(--text2); }
  .suggestion-card.active { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .suggestion-card .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .suggestion-card .line-ref { font-family: "SF Mono", Monaco, monospace; font-size: 11px; background: var(--bg3); padding: 2px 6px; border-radius: 3px; color: var(--blue); }
  .suggestion-card .category { font-size: 11px; color: var(--purple); }
  .suggestion-card .source { font-size: 10px; color: var(--cyan); border: 1px solid var(--cyan); padding: 0 4px; border-radius: 3px; }
  .suggestion-card .target-text { font-size: 12px; color: var(--text2); font-family: "SF Mono", Monaco, monospace; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggestion-card .suggestion-text { font-size: 13px; line-height: 1.5; color: var(--text); }
  .suggestion-card .card-actions { display: flex; gap: 6px; margin-top: 10px; }
  .suggestion-card .card-actions button { padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); transition: all 0.15s; }
  .suggestion-card .card-actions button:hover { border-color: var(--text2); color: var(--text); }
  .suggestion-card .card-actions button.approve-btn:hover, .suggestion-card .card-actions button.approve-btn.active { border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .suggestion-card .card-actions button.reject-btn:hover, .suggestion-card .card-actions button.reject-btn.active { border-color: var(--red); color: var(--red); background: var(--red-bg); }
  .suggestion-card .card-actions button.reset-btn { margin-left: auto; }
  .suggestion-card .comment-area { margin-top: 8px; }
  .suggestion-card textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 8px; font-size: 12px; color: var(--text); resize: vertical; min-height: 36px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; }
  .suggestion-card textarea:focus { outline: none; border-color: var(--blue); }
  .suggestion-card textarea::placeholder { color: var(--text2); }
  .suggestion-card .status-badge { font-size: 11px; padding: 2px 6px; border-radius: 3px; font-weight: 500; }
  .status-badge.pending { background: var(--amber-bg); color: var(--amber); }
  .status-badge.approved { background: var(--green-bg); color: var(--green); }
  .status-badge.rejected { background: var(--red-bg); color: var(--red); }
  .prompt-panel { border-top: 1px solid var(--border); flex-shrink: 0; background: var(--bg2); max-height: 260px; display: flex; flex-direction: column; }
  .prompt-header { display: flex; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .prompt-header span { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
  .copy-btn { margin-left: auto; padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); transition: all 0.15s; }
  .copy-btn:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .copy-btn.copied { border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .prompt-content { flex: 1; overflow-y: auto; padding: 12px 16px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; font-family: "SF Mono", Monaco, Consolas, monospace; }
  .prompt-content::-webkit-scrollbar { width: 6px; }
  .prompt-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .prompt-content .placeholder { color: var(--text2); font-style: italic; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; }
</style>
</head>
<body>
<div class="header">
  <h1>Document Review</h1>
  <span class="file"><!-- FILL: doc path --></span>
  <span class="hint">Click any line to add comment &middot; <kbd>Esc</kbd> cancel &middot; <kbd>Ctrl+Enter</kbd> save</span>
  <div class="stats">
    <div class="stat"><div class="dot pending"></div><span class="count" id="stat-pending">0</span></div>
    <div class="stat"><div class="dot approved"></div><span class="count" id="stat-approved">0</span></div>
    <div class="stat"><div class="dot rejected"></div><span class="count" id="stat-rejected">0</span></div>
    <div class="stat"><div class="dot user-comment"></div><span class="count" id="stat-user">0</span></div>
  </div>
</div>
<div class="main">
  <div class="doc-panel" id="docPanel"></div>
  <div class="suggestions-panel">
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="pending">Pending</button>
      <button class="filter-tab" data-filter="approved">Approved</button>
      <button class="filter-tab" data-filter="rejected">Rejected</button>
      <button class="filter-tab" data-filter="user">My Comments</button>
    </div>
    <div class="suggestion-list" id="suggestionList"></div>
  </div>
</div>
<div class="prompt-panel">
  <div class="prompt-header"><span>Prompt Output</span><button class="copy-btn" id="copyBtn">Copy</button></div>
  <div class="prompt-content" id="promptContent"><div class="placeholder">Click a line to add a comment, or approve suggestions to generate a prompt...</div></div>
</div>
<script>
const DOC_LINES = [
/* FILL: DOC_LINES */
];

const autoSuggestions = [
/* FILL: autoSuggestions */
];

let nextUserCommentId = 1;
let state = { autoSuggestions: autoSuggestions.map(s => ({...s})), userComments: [], activeFilter: "all", activeSuggestionId: null, editingLine: null };

function getAutoSuggestionForLine(lineNum) { return state.autoSuggestions.find(s => lineNum >= s.targetLineStart && lineNum <= s.targetLineEnd); }
function getUserCommentForLine(lineNum) { return state.userComments.find(c => c.lineNum === lineNum); }
function getAllSuggestions() {
  const auto = state.autoSuggestions.map(s => ({...s, source: 'auto'}));
  const user = state.userComments.map(c => ({ id: c.id, lineRef: "Line " + c.lineNum, targetLineStart: c.lineNum, targetLineEnd: c.lineNum, targetText: DOC_LINES[c.lineNum - 1] || '', suggestion: c.text, category: 'user', status: 'approved', userComment: '', source: 'user' }));
  return [...auto, ...user];
}
function getLineClasses(lineNum) {
  const auto = getAutoSuggestionForLine(lineNum);
  const user = getUserCommentForLine(lineNum);
  const classes = [];
  if (auto) classes.push(auto.status);
  if (user) classes.push('user-commented');
  return classes.join(' ');
}

function renderDocument() {
  const panel = document.getElementById('docPanel');
  let html = ''; let inCodeBlock = false;
  DOC_LINES.forEach((line, i) => {
    const lineNum = i + 1;
    if (line.trim().startsWith('```')) { inCodeBlock = !inCodeBlock; html += '<div class="doc-line ' + (inCodeBlock ? 'code-start' : 'code-end') + '"><span class="line-num">' + lineNum + '</span><span class="line-content">' + escHtml(line) + '</span></div>'; return; }
    if (inCodeBlock) { html += '<div class="doc-line code-content"><span class="line-num">' + lineNum + '</span><span class="line-content">' + escHtml(line) + '</span></div>'; return; }
    const cls = getLineClasses(lineNum);
    let rendered = escHtml(line);
    if (line.startsWith('# ')) rendered = '<h1-line>' + rendered + '</h1-line>';
    else if (line.startsWith('## ')) rendered = '<h2-line>' + rendered + '</h2-line>';
    else if (line.startsWith('### ')) rendered = '<h3-line>' + rendered + '</h3-line>';
    if (line.trim() && !line.startsWith('#') && !line.startsWith('|') && !line.startsWith('>')) { rendered = rendered.replace(/`([^`]+)`/g, '<code>$1</code>'); rendered = rendered.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }
    const showPlusBtn = !getUserCommentForLine(lineNum) && !getAutoSuggestionForLine(lineNum);
    html += '<div class="doc-line ' + cls + '" data-line="' + lineNum + '"><span class="line-num">' + lineNum + '</span><span class="line-content">' + rendered + '</span>';
    if (showPlusBtn) html += '<button class="add-comment-btn" data-add="' + lineNum + '" title="Add comment">+</button>';
    html += '</div>';
    if (state.editingLine === lineNum) { html += '<div class="inline-comment"><textarea id="inlineTextarea" placeholder="Type your comment for Line ' + lineNum + '..."></textarea><div class="inline-actions"><button class="save-btn" data-save="' + lineNum + '">Save</button><button class="cancel-btn" data-cancel="' + lineNum + '">Cancel</button></div></div>'; }
    const uc = getUserCommentForLine(lineNum);
    if (uc && state.editingLine !== lineNum) { html += '<div class="inline-comment-display"><span class="comment-icon">&#x1f4ac;</span><div class="comment-body"><div class="comment-text">' + escHtml(uc.text) + '</div><div class="comment-actions"><button data-edituc="' + lineNum + '">edit</button><button class="del-btn" data-deluc="' + lineNum + '">delete</button></div></div></div>'; }
  });
  panel.innerHTML = html;
  if (state.editingLine) { const ta = document.getElementById('inlineTextarea'); if (ta) ta.focus(); }
  panel.addEventListener('click', handleDocClick);
}

function handleDocClick(e) {
  const addBtn = e.target.closest('[data-add]');
  if (addBtn) { e.stopPropagation(); state.editingLine = parseInt(addBtn.dataset.add); renderDocument(); return; }
  const saveBtn = e.target.closest('[data-save]');
  if (saveBtn) { e.stopPropagation(); const ln = parseInt(saveBtn.dataset.save); const ta = document.getElementById('inlineTextarea'); if (ta && ta.value.trim()) { state.userComments = state.userComments.filter(c => c.lineNum !== ln); state.userComments.push({ id: nextUserCommentId++, lineNum: ln, text: ta.value.trim() }); } state.editingLine = null; updateAll(); return; }
  const cancelBtn = e.target.closest('[data-cancel]');
  if (cancelBtn) { e.stopPropagation(); state.editingLine = null; renderDocument(); return; }
  const editBtn = e.target.closest('[data-edituc]');
  if (editBtn) { e.stopPropagation(); state.editingLine = parseInt(editBtn.dataset.edituc); renderDocument(); return; }
  const delBtn = e.target.closest('[data-deluc]');
  if (delBtn) { e.stopPropagation(); state.userComments = state.userComments.filter(c => c.lineNum !== parseInt(delBtn.dataset.deluc)); updateAll(); return; }
  const lineEl = e.target.closest('.doc-line:not(.code-start):not(.code-end):not(.code-content)');
  if (lineEl && !e.target.closest('.add-comment-btn')) {
    const lineNum = parseInt(lineEl.dataset.line);
    const s = getAutoSuggestionForLine(lineNum);
    if (s) { state.activeSuggestionId = s.id; renderSuggestions(); const card = document.querySelector('.suggestion-card[data-id="' + s.id + '"]'); if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  }
}

function renderSuggestions() {
  const list = document.getElementById('suggestionList');
  const all = getAllSuggestions();
  let filtered;
  if (state.activeFilter === 'user') filtered = all.filter(s => s.source === 'user');
  else if (state.activeFilter === 'all') filtered = all;
  else filtered = all.filter(s => s.status === state.activeFilter);
  if (filtered.length === 0) { list.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text2); font-size: 13px;">No items match this filter</div>'; return; }
  list.innerHTML = filtered.map(s => {
    const isUser = s.source === 'user';
    const isActive = s.id === state.activeSuggestionId;
    if (isUser) return '<div class="suggestion-card ' + (isActive ? 'active' : '') + '" data-id="' + s.id + '" data-usercard><div class="card-header"><span class="line-ref">' + s.lineRef + '</span><span class="source">MY COMMENT</span></div><div class="target-text" title="' + escHtml(s.targetText) + '">' + escHtml(s.targetText) + '</div><div class="suggestion-text">' + escHtml(s.suggestion) + '</div></div>';
    return '<div class="suggestion-card ' + (isActive ? 'active' : '') + '" data-id="' + s.id + '"><div class="card-header"><span class="line-ref">' + s.lineRef + '</span><span class="category">' + s.category + '</span><span class="status-badge ' + s.status + '">' + s.status + '</span></div><div class="target-text" title="' + escHtml(s.targetText) + '">' + escHtml(s.targetText) + '</div><div class="suggestion-text">' + escHtml(s.suggestion) + '</div><div class="card-actions"><button class="approve-btn ' + (s.status === 'approved' ? 'active' : '') + '" onclick="setAction(\'' + s.id + '\', \'approved\')">Approve</button><button class="reject-btn ' + (s.status === 'rejected' ? 'active' : '') + '" onclick="setAction(\'' + s.id + '\', \'rejected\')">Reject</button>' + (s.status !== 'pending' ? '<button class="reset-btn" onclick="setAction(\'' + s.id + '\', \'pending\')">Reset</button>' : '') + '</div><div class="comment-area"><textarea placeholder="Add a note..." oninput="setAutoComment(\'' + s.id + '\', this.value)">' + escHtml(s.userComment) + '</textarea></div></div>';
  }).join('');
  list.querySelectorAll('.suggestion-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
      const id = card.dataset.id; state.activeSuggestionId = id; renderSuggestions();
      const s = getAllSuggestions().find(x => String(x.id) === String(id));
      if (s) { const el = document.querySelector('.doc-line[data-line="' + s.targetLineStart + '"]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });
  });
}

function setAction(id, status) { const s = state.autoSuggestions.find(x => x.id === id); if (s) { s.status = status; updateAll(); } }
function setAutoComment(id, comment) { const s = state.autoSuggestions.find(x => x.id === id); if (s) { s.userComment = comment; updatePrompt(); } }

function updateStats() {
  document.getElementById('stat-pending').textContent = state.autoSuggestions.filter(s => s.status === 'pending').length;
  document.getElementById('stat-approved').textContent = state.autoSuggestions.filter(s => s.status === 'approved').length;
  document.getElementById('stat-rejected').textContent = state.autoSuggestions.filter(s => s.status === 'rejected').length;
  document.getElementById('stat-user').textContent = state.userComments.length;
}

function updatePrompt() {
  const el = document.getElementById('promptContent');
  const approved = state.autoSuggestions.filter(s => s.status === 'approved');
  const commentedAuto = state.autoSuggestions.filter(s => s.userComment && s.userComment.trim() && s.status !== 'approved');
  const rejected = state.autoSuggestions.filter(s => s.status === 'rejected');
  const userComments = state.userComments;
  if (approved.length === 0 && commentedAuto.length === 0 && userComments.length === 0) { el.innerHTML = '<div class="placeholder">Click a line to add a comment, or approve suggestions to generate a prompt...</div>'; return; }
  var prompt = 'Please update `<!-- FILL: doc filepath -->` with the following changes:\n\n';
  if (approved.length > 0) { prompt += '## Approved Improvements\n\n'; for (const s of approved) { prompt += '- **' + s.lineRef + '** [' + s.category + ']: ' + s.suggestion; if (s.userComment && s.userComment.trim()) prompt += '\n  User note: ' + s.userComment.trim(); prompt += '\n\n'; } }
  if (userComments.length > 0) { prompt += '## My Comments\n\n'; for (const c of userComments) { const lt = DOC_LINES[c.lineNum - 1] || ''; prompt += '- **Line ' + c.lineNum + '** (`' + lt.substring(0, 60).trim() + (lt.length > 60 ? '...' : '') + '`):\n  ' + c.text + '\n\n'; } }
  if (commentedAuto.length > 0) { prompt += '## Additional Feedback\n\n'; for (const s of commentedAuto) { const label = s.status === 'rejected' ? 'Rejected' : 'Pending'; prompt += '- **' + s.lineRef + '** [' + label + ', ' + s.category + ']: ' + s.userComment.trim() + '\n\n'; } }
  if (rejected.length > 0) { const uc = rejected.filter(s => !s.userComment || !s.userComment.trim()); if (uc.length > 0) { prompt += '## Rejected (for context)\n\n'; for (const s of uc) prompt += '- ~~' + s.lineRef + ': ' + s.suggestion + '~~\n'; } }
  el.textContent = prompt;
}

function updateAll() { const panel = document.getElementById('docPanel'); panel.removeEventListener('click', handleDocClick); renderDocument(); renderSuggestions(); updateStats(); updatePrompt(); }

document.getElementById('filterTabs').addEventListener('click', (e) => {
  if (e.target.classList.contains('filter-tab')) { document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active')); e.target.classList.add('active'); state.activeFilter = e.target.dataset.filter; renderSuggestions(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.editingLine) { state.editingLine = null; renderDocument(); }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && state.editingLine) {
    const ta = document.getElementById('inlineTextarea');
    if (ta && ta.value.trim()) { const ln = state.editingLine; state.userComments = state.userComments.filter(c => c.lineNum !== ln); state.userComments.push({ id: nextUserCommentId++, lineNum: ln, text: ta.value.trim() }); state.editingLine = null; updateAll(); }
  }
});
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('promptContent').textContent).then(() => { const btn = document.getElementById('copyBtn'); btn.textContent = 'Copied!'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500); });
});
function escHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
updateAll();
</script>
</body>
</html>
